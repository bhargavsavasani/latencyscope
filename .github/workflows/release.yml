name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # to create the GitHub release and attach the APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Publishing something that does not pass its own gate is how a bad
      # release becomes permanent — artifacts on Central cannot be deleted.
      - name: Check
        run: ./gradlew check --stacktrace

      # Uploads a *staged* deployment. It is released by hand in the Central
      # Portal, because an artifact on Central can never be taken back — the
      # convention plugin sets automaticRelease = false for that reason.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Staging, not release: it is the minified build with the real library
      # linked, so the attached APK is one someone can actually record with.
      - name: Build sample APK
        run: ./gradlew :sample:assembleStaging --stacktrace

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sample/build/outputs/apk/staging/*.apk
