name: Feature request
description: Something the library should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write this: every `public` declaration is a
        permanent commitment from the first release, and has to be mirrored in
        `latencyscope-noop` forever. So the useful question is usually not
        "can it do X" but "what were you trying to find out".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: The question about your app you cannot currently answer — not the API you imagine answering it.
    validations: { required: true }

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Including why the existing report does not tell you.
    validations: { required: true }

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A sketch of the API, or the shape of the output.
